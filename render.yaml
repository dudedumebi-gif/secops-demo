# Render Blueprint — review only, not yet deployed.
# Apply in the Render dashboard: New+ > Blueprint, connect dudedumebi-gif/secops-demo.
# See omnibrain/RENDER.md for the honest Free-tier caveats before you deploy.
services:
  # OmniBrain — Python web service. Turso remote when TURSO_* are set
  # (chosen route, see omnibrain/TURSO.md), Postgres when DATABASE_URL
  # is a postgres:// URL, local SQLite otherwise.
  - type: web
    name: omnibrain
    runtime: python
    rootDir: omnibrain
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically; do not hardcode it here.
      # Stateful option (chosen): Turso remote. Set both in the Render
      # dashboard; Turso WINS over Postgres if both are set. Placeholder
      # only — never a real value in this file, and never commit a real
      # URL or token. See omnibrain/TURSO.md.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Postgres fallback (optional, empty by default). Turso wins if
      # both are set, so leave this empty on Render unless you are
      # deliberately switching to a postgres:// provider.
      - key: DATABASE_URL
        sync: false
      # Optional, never required, never commit a real value:
      - key: OPENAI_API_KEY
        sync: false
  # SOC demo — static site, no build step, saves nothing.
  # Render Blueprint has no "static" service type: a static site is
  # type: web with runtime: static (that was the "unknown type" error).
  - type: web
    name: soc-demo
    runtime: static
    buildCommand: "echo 'static — no build step'"
    staticPublishPath: soc-demo
